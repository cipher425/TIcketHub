# Local infrastructure (optional - MongoDB Atlas + Upstash work without Docker).
#   docker compose up -d
#   MONGODB_URI=mongodb://localhost:27017/tickethub?replicaSet=rs0
#   REDIS_URL=redis://localhost:6379
services:
  mongo:
    image: mongo:7
    # Single-node REPLICA SET: required for multi-document transactions.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: echo "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    command: ['redis-server', '--appendonly', 'no', '--maxmemory-policy', 'noeviction']

volumes:
  mongo-data:
